name: controle_classificacao_cbbc
description: "Controle Classificação CBBC — app offline para comissários conferirem pontos funcionais em quadra (basquetebol em cadeira de rodas)."
publish_to: "none"
version: 2.9.0+26

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  excel: ^4.0.6
  file_picker: ^8.1.2
  http: ^1.2.0
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2
  syncfusion_flutter_pdf: ^27.1.48
  url_launcher: ^6.3.0
  vibration: ^2.0.0
  wakelock_plus: ^1.2.8
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Relógio fake pros testes do heartbeat da transmissão (30s) sem esperar
  # tempo real. Mesma versão já trazida transitivamente pelo flutter_test.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
