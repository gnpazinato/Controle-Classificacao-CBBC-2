plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Chave fixa de assinatura (android/keystore/). Sem ela o Android trata
// cada APK como app "diferente" e recusa atualizar por cima — era o que
// acontecia quando o release saía assinado com a chave debug efêmera do CI.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore/keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "br.org.cbbc.controle_classificacao_cbbc"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "br.org.cbbc.controleclassificacao"
        minSdk = 29
        targetSdk = 36
        // Vem do `version:` em pubspec.yaml — formato `X.Y.Z+N`,
        // onde X.Y.Z é o versionName e N é o versionCode.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = rootProject.file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                storeType = keystoreProperties['storeType']
            }
        }
    }

    buildTypes {
        release {
            // Fallback pra chave debug só quando o keystore não está
            // presente (ex.: fork sem a pasta keystore/).
            signingConfig = keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
