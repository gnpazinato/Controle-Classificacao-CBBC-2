plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "br.org.cbbc.controle_classificacao_cbbc"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "br.org.cbbc.controleclassificacao"
        minSdk = 29
        targetSdk = 36
        // Vem do `version:` em pubspec.yaml — formato `X.Y.Z+N`,
        // onde X.Y.Z é o versionName e N é o versionCode.
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Usa chave debug pra permitir `flutter build apk --release` no CI sem keystore.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
