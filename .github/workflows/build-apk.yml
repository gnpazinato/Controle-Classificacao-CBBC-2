name: Build Android APK

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.0"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project files
        run: |
          flutter create . \
            --project-name controle_classificacao_cbbc \
            --org br.org.cbbc \
            --platforms=android,web \
            --description "Controle Classificação CBBC"
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')
          APK_DIR=build/app/outputs/flutter-apk
          APK_NAME="controle-classificacao-cbbc-v${VERSION}.apk"
          cp "${APK_DIR}/app-release.apk" "${APK_DIR}/${APK_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: controle-classificacao-cbbc-v${{ steps.rename.outputs.version }}
          path: build/app/outputs/flutter-apk/${{ steps.rename.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30
