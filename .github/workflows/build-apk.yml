name: Build Android APK

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Necessário pra publicar a GitHub Release com o APK — é dela que o
      # botão "nova versão disponível" do app baixa a atualização.
      contents: write
    env:
      # Keystore fixo de assinatura, fornecido por secrets (nunca vive no
      # repositório): KEYSTORE_BASE64 é o .p12 em base64 e
      # KEYSTORE_PASSWORD a senha. Vazios (secrets não configurados) → o
      # build assina com chave debug e o APK NÃO atualiza por cima da
      # instalação anterior.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.32.0"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project files
        run: |
          flutter create . \
            --project-name controle_classificacao_cbbc \
            --org br.org.cbbc \
            --platforms=android,web \
            --description "Controle Classificação CBBC"
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      # Reconstrói o keystore e o keystore.properties (ambos gitignored)
      # a partir dos secrets. Sem eles o build cai na chave debug
      # (fallback do build.gradle).
      - name: Configure release signing
        if: ${{ env.KEYSTORE_BASE64 != '' && env.KEYSTORE_PASSWORD != '' }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d \
            > android/keystore/cbbc-release.p12
          {
            echo "storeFile=keystore/cbbc-release.p12"
            echo "storeType=PKCS12"
            echo "keyAlias=cbbc"
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEYSTORE_PASSWORD}"
          } > android/keystore/keystore.properties

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK with version
        id: rename
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/+.*//')
          APK_DIR=build/app/outputs/flutter-apk
          APK_NAME="controle-classificacao-cbbc-v${VERSION}.apk"
          cp "${APK_DIR}/app-release.apk" "${APK_DIR}/${APK_NAME}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: controle-classificacao-cbbc-v${{ steps.rename.outputs.version }}
          path: build/app/outputs/flutter-apk/${{ steps.rename.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      # Push na main → publica/atualiza a GitHub Release v<versão> com o
      # APK anexado. O app consulta a release mais recente pra oferecer
      # "nova versão disponível" na tela inicial, com download direto no
      # tablet (sem baixar no computador e transferir).
      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.rename.outputs.version }}"
          TAG="v${VERSION}"
          APK="build/app/outputs/flutter-apk/${{ steps.rename.outputs.apk_name }}"
          # Re-push da mesma versão substitui a release existente.
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Controle Classificação CBBC v${VERSION}" \
            --notes "APK com assinatura fixa: instala por cima da versão anterior mantendo os dados do tablet (inclusive o link de transmissão). Detalhes no CHANGELOG.md." \
            "$APK"
